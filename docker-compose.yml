services:
  postgres-db:
    image: postgres:16-alpine
    container_name: profelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profelink_dev}
      POSTGRES_DB: ${POSTGRES_DB:-profelink_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-profelink} -d ${POSTGRES_DB:-profelink_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - profelink-net

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: profelink-auth-service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      AUTH_PORT: 3001
      DATABASE_URL_AUTH: postgresql://${POSTGRES_USER:-profelink}:${POSTGRES_PASSWORD:-profelink_dev}@postgres-db:5432/${POSTGRES_DB:-profelink_db}?schema=auth
      JWT_SECRET: ${JWT_SECRET:-change-me-use-a-long-random-secret-in-production}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-profelink-game-api}
      JWT_ISSUER: ${JWT_ISSUER:-profelink-auth-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: auth-service
    ports:
      - "${AUTH_PORT:-3001}:3001"
    networks:
      - profelink-net

  game-service:
    build:
      context: .
      dockerfile: apps/game-service/Dockerfile
    container_name: profelink-game-service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      GAME_PORT: 3002
      DATABASE_URL_GAME: postgresql://${POSTGRES_USER:-profelink}:${POSTGRES_PASSWORD:-profelink_dev}@postgres-db:5432/${POSTGRES_DB:-profelink_db}?schema=game
      JWT_SECRET: ${JWT_SECRET:-change-me-use-a-long-random-secret-in-production}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-profelink-game-api}
      JWT_ISSUER: ${JWT_ISSUER:-profelink-auth-service}
      UPLOAD_DIR: /app/uploads
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: game-service
    ports:
      - "${GAME_PORT:-3002}:3002"
    volumes:
      - quiz_images:/app/uploads
    networks:
      - profelink-net

  web-client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-http://localhost:3001}
        VITE_GAME_API_URL: ${VITE_GAME_API_URL:-http://localhost:3002}
        VITE_GAME_WS_URL: ${VITE_GAME_WS_URL:-http://localhost:3002}
    container_name: verix-web-client
    restart: unless-stopped
    depends_on:
      - auth-service
      - game-service
    ports:
      - "${WEB_CLIENT_PORT:-5173}:5173"
    networks:
      - profelink-net

  external-consumer:
    build:
      context: .
      dockerfile: apps/external-consumer/Dockerfile
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-http://localhost:3001}
        VITE_GAME_API_URL: ${VITE_GAME_API_URL:-http://localhost:3002}
    container_name: verix-external-consumer
    restart: unless-stopped
    depends_on:
      - auth-service
      - game-service
    ports:
      - "${EXTERNAL_CONSUMER_PORT:-5174}:5174"
    networks:
      - profelink-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: profelink-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    mem_limit: 256m
    networks:
      - profelink-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: profelink-prometheus
    restart: unless-stopped
    depends_on:
      - otel-collector
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 256m
    networks:
      - profelink-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: profelink-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/profelink-overview.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    networks:
      - profelink-net

networks:
  profelink-net:
    name: profelink-net
    driver: bridge

volumes:
  pgdata:
    name: profelink_pgdata
  quiz_images:
    name: profelink_quiz_images
